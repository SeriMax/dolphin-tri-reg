name: Personal Full CMake Build Dolphin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Remove broken implot
      shell: bash
      run: |
        rm -rf Externals/implot
        if [ -f Externals/CMakeLists.txt ]; then
          sed -i '/implot/d' Externals/CMakeLists.txt
        fi

    - name: Install Qt5
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        dir: '${{ github.workspace }}/'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Configure CMake
      shell: bash
      run: |
        cmake -S . -B build -A x64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_QT=ON \
          -DENABLE_QT6=OFF \
          -DENABLE_WX=OFF \
          -DWARNINGS_AS_ERRORS=OFF \
          -DUSE_MGBA=OFF \
          -DENABLE_ANALYTICS=OFF \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/5.15.2/msvc2019_64" \
          -DQt5_DIR="${{ github.workspace }}/Qt/5.15.2/msvc2019_64/lib/cmake/Qt5"

    - name: Build Project
      run: |
        cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

    - name: Pack Full Build
      shell: bash
      run: |
        mkdir -p output
        cp -r Binary/Release/* output/ 2>/dev/null || true
        cp -r build/Binaries/Release/* output/ 2>/dev/null || true
        find build -name "Dolphin.exe" -exec cp {} output/ \; 2>/dev/null || true
        find build -name "*.dll" -exec cp {} output/ \; 2>/dev/null || true

    - name: Upload Finished Build
      uses: actions/upload-artifact@v4
      with:
        name: Dolphin-Triforce-Full-Windows
        path: output/
